name: transcribe
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "conference ids, comma-separated (e.g. 6526-20261103)"
        required: true
      model:
        description: "faster-whisper model"
        default: medium
        type: choice
        options: [small, medium, large-v3]
permissions:
  contents: write
concurrency:
  group: transcribe-${{ github.event.inputs.model }}
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install faster-whisper opencc-python-reimplemented
          nproc; free -g | head -2
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ github.event.inputs.model }}
      - name: Transcribe
        run: python scripts/transcribe.py --ids "${{ github.event.inputs.ids }}" --model "${{ github.event.inputs.model }}"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/detail data/conferences.json
          git diff --cached --quiet && exit 0
          git commit -m "transcribe (${{ github.event.inputs.model }}): ${{ github.event.inputs.ids }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
